name: deploy-prod
# Bible 13.3 / 13.4: tag v* -> manual approval -> pre-migration snapshot -> migrate -> rolling deploy ->
# smoke test -> automatic rollback on failed health.
# Configure in GitHub BEFORE first use: environment "production" with required reviewers (the approval gate)
# and variables AWS_DEPLOY_ROLE_ARN, MC_DOMAIN, optional AWS_REGION. The role trust policy only accepts
# the `environment:production` OIDC subject of this repository.
on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: prod
  AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag format and ancestry
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Required reviewers on this GitHub environment are the manual approval gate.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-prod-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image reference
        id: image
        run: |
          TAG="${GITHUB_SHA::12}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ steps.ecr.outputs.registry }}/mc-${ENVIRONMENT}-backend:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check whether the image already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "mc-${ENVIRONMENT}-backend" \
               --image-ids "imageTag=${{ steps.image.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found == 'false'

      - name: Build and push image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record current task definitions (rollback target)
        run: |
          for s in api ws worker beat; do
            aws ecs describe-services --cluster "mc-${ENVIRONMENT}" --services "mc-${ENVIRONMENT}-${s}" \
              --query 'services[0].taskDefinition' --output text > "${RUNNER_TEMP}/prev-${s}.txt"
            echo "${s}: $(cat "${RUNNER_TEMP}/prev-${s}.txt")"
          done

      - name: Pre-migration RDS snapshot
        run: |
          SNAP="mc-${ENVIRONMENT}-premigrate-${GITHUB_RUN_ID}-${GITHUB_SHA::7}"
          aws rds create-db-snapshot --db-instance-identifier "mc-${ENVIRONMENT}-postgres" \
            --db-snapshot-identifier "$SNAP" \
            --tags "Key=purpose,Value=pre-migration" "Key=git_sha,Value=${GITHUB_SHA}" "Key=tag,Value=${GITHUB_REF_NAME}" \
            --query DBSnapshot.Status --output text
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP"
          echo "Snapshot ${SNAP} available"
          echo "### Pre-migration snapshot: \`${SNAP}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run database migrations (one-off ECS task)
        run: infra/scripts/ecs-run-migrate.sh "$ENVIRONMENT" "${{ steps.image.outputs.ref }}"

      # ecs-deploy.sh rolls back by itself if the rollout or the stability wait fails.
      - name: Deploy services (rolling, auto-rollback)
        id: deploy
        run: infra/scripts/ecs-deploy.sh "$ENVIRONMENT" "${{ steps.image.outputs.ref }}"

      - name: Smoke test /ready
        run: infra/scripts/smoke-test.sh "${{ vars.MC_DOMAIN }}"

      # Reached only if the deploy itself succeeded but the public smoke test failed.
      - name: Roll back after failed smoke test
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          for s in api ws worker beat; do
            aws ecs update-service --cluster "mc-${ENVIRONMENT}" --service "mc-${ENVIRONMENT}-${s}" \
              --task-definition "$(cat "${RUNNER_TEMP}/prev-${s}.txt")" >/dev/null
          done
          aws ecs wait services-stable --cluster "mc-${ENVIRONMENT}" \
            --services "mc-${ENVIRONMENT}-api" "mc-${ENVIRONMENT}-ws" "mc-${ENVIRONMENT}-worker" "mc-${ENVIRONMENT}-beat"
          echo "::error::Rolled back to the previous task definitions after a failed smoke test"
          echo "### ROLLED BACK after failed smoke test" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "### deploy-prod"
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- image: \`${{ steps.image.outputs.ref }}\`"
            echo "- outcome: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
