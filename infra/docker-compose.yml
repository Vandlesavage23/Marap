name: marriage-connect
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: mc, POSTGRES_PASSWORD: mc, POSTGRES_DB: mc}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mc"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 10}
  minio-init:
    image: minio/mc
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: >
      /bin/sh -c "mc alias set l http://minio:9000 minioadmin minioadmin &&
      mc mb -p l/media-private l/exports-private l/static-public && exit 0"
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    healthcheck: {test: ["CMD", "clamdcheck.sh"], interval: 30s, timeout: 10s, retries: 10, start_period: 120s}
volumes: {pgdata: {}, miniodata: {}}
