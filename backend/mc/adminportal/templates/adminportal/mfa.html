{% extends "adminportal/base.html" %}{% block body %}<h1>Two-step verification</h1>
{% if enrolling %}<p>Add this key to your authenticator app, then enter the 6-digit code:</p><p><code>{{ otpauth }}</code></p>{% endif %}
