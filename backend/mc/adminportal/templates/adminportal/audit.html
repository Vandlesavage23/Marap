{% extends "adminportal/base.html" %}{% block body %}<h1>Audit log</h1><form method="get"><input name="target" placeholder="Target id"><input name="action" placeholder="Action"><button>Search</button></form>
<table><tr><th>When</th><th>Actor</th><th>Role</th><th>Action</th><th>Target</th><th>Reason</th></tr>{% for e in rows %}<tr><td>{{ e.created_at }}</td><td>{{ e.actor_type }} {{ e.actor_id|default:"" }}</td><td>{{ e.role }}</td><td>{{ e.action }}</td><td>{{ e.target_type }} {{ e.target_id|default:"" }}</td><td>{{ e.reason }}</td></tr>{% endfor %}</table>{% endblock %}
