{% extends "webcheckout/base.html" %}{% block body %}<h2>Enter your code</h2><p>If that number has an account, a 6-digit code is on its way.</p><p style="margin: 0.75rem 0; color: #166534; background: #f0fdf4; padding: 0.5rem; border-radius: 6px; font-size: 0.9rem;"><strong>Dev Bypass Active:</strong> Enter any 6 digits (e.g. <code>123456</code> or <code>000000</code>) to proceed.</p><form method="post">{% csrf_token %}<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="123456" required autofocus><button>Continue</button></form>{% endblock %}
