components:
  schemas:
    ActionEnum:
      enum:
      - pass
      - not_relevant
      type: string
      description: |-
        * `pass` - pass
        * `not_relevant` - not_relevant
    AnswerItem:
      type: object
      properties:
        question:
          type: string
          maxLength: 60
        value: {}
        importance:
          type: integer
          maximum: 3
          minimum: 1
          default: 2
        is_dealbreaker:
          type: boolean
          default: false
      required:
      - question
      - value
    Answers:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerItem'
      required:
      - answers
    BetaFeedback:
      type: object
      properties:
        message:
          type: string
          maxLength: 2000
          minLength: 3
        screen:
          type: string
          default: ''
          maxLength: 40
        rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        app_version:
          type: string
          default: ''
          maxLength: 32
      required:
      - message
    Block:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
      required:
      - profile_id
    Checkout:
      type: object
      properties:
        product_code:
          type: string
          maxLength: 30
        method:
          $ref: '#/components/schemas/MethodEnum'
        phone:
          type: string
          default: ''
          maxLength: 32
        network:
          type: string
          default: ''
          maxLength: 10
      required:
      - method
      - product_code
    Code:
      type: object
      properties:
        code:
          type: string
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - code
    ConsentItem:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConsentItemKindEnum'
        version:
          type: string
          maxLength: 20
        granted:
          type: boolean
      required:
      - granted
      - kind
      - version
    ConsentItemKindEnum:
      enum:
      - terms
      - privacy
      - data_transfer
      - special_religion
      - special_finance
      - married_visibility
      - marketing
      type: string
      description: |-
        * `terms` - terms
        * `privacy` - privacy
        * `data_transfer` - data_transfer
        * `special_religion` - special_religion
        * `special_finance` - special_finance
        * `married_visibility` - married_visibility
        * `marketing` - marketing
    Consents:
      type: object
      properties:
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentItem'
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          default: app
      required:
      - consents
    ContextTypeEnum:
      enum:
      - profile
      - interest
      - message
      type: string
      description: |-
        * `profile` - profile
        * `interest` - interest
        * `message` - message
    CreateSession:
      type: object
      properties:
        id_type:
          type: string
          default: ''
          maxLength: 30
        issuing_country:
          oneOf:
          - type: string
            default: ''
            pattern: ^[A-Za-z]{2}$
          - type: string
            maxLength: 0
    Description:
      type: object
      properties:
        text:
          type: string
          maxLength: 1000
          minLength: 150
      required:
      - text
    DeviceInfo:
      type: object
      properties:
        install_id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        app_version:
          type: string
          default: ''
          maxLength: 32
        os_version:
          type: string
          default: ''
          maxLength: 32
      required:
      - install_id
      - platform
    DiscoveryFeedback:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
      - profile_id
    EmailStart:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    Location:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
      required:
      - lat
      - lng
    MessagesRead:
      type: object
      properties:
        up_to_message_id:
          type: string
          format: uuid
      required:
      - up_to_message_id
    MethodEnum:
      enum:
      - mobile_money
      - card
      type: string
      description: |-
        * `mobile_money` - mobile_money
        * `card` - card
    NotificationsRead:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
    OtpStart:
      type: object
      properties:
        phone:
          type: string
          maxLength: 32
        purpose:
          allOf:
          - $ref: '#/components/schemas/OtpStartPurposeEnum'
          default: login
      required:
      - phone
    OtpStartPurposeEnum:
      enum:
      - login
      - recover
      type: string
      description: |-
        * `login` - login
        * `recover` - recover
    OtpVerify:
      type: object
      properties:
        phone:
          type: string
          maxLength: 32
        code:
          type: string
          maxLength: 6
          pattern: ^\d{6}$
        device:
          $ref: '#/components/schemas/DeviceInfo'
        invite_code:
          type: string
          default: ''
          maxLength: 20
      required:
      - code
      - phone
    PatchedProfileUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 30
          minLength: 2
        gender:
          type: string
          maxLength: 10
        district:
          type: string
          maxLength: 40
        diaspora_country:
          type: string
          maxLength: 2
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        intention:
          type: string
          maxLength: 24
        marriage_timeline:
          type: string
          maxLength: 10
        marital_status:
          type: string
          maxLength: 20
        married_declaration:
          type: boolean
        marriage_form_preference:
          type: string
          maxLength: 30
        show_married_profiles:
          type: boolean
        has_children:
          type: string
          maxLength: 24
        wants_children:
          type: string
          maxLength: 8
        languages:
          type: array
          items:
            type: string
            maxLength: 3
          maxItems: 8
        religion:
          type: string
          nullable: true
          maxLength: 60
        religion_practice:
          type: string
          nullable: true
          maxLength: 60
        occupation:
          type: string
          maxLength: 60
        education:
          type: string
          maxLength: 24
    PhotoCreate:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
      required:
      - media_id
    PhotoOrder:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 6
      required:
      - ids
    PlatformEnum:
      enum:
