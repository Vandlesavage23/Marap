  sqlite3_flutter_libs: ^0.5.28
  url_launcher: ^6.3.3
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
