name: marriage_connect
description: Marriage Connect mobile app (verified courtship and marriage, Uganda).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  cached_network_image: ^4.0.4
  connectivity_plus: ^6.1.1
  dio: ^5.7.0
  drift: ^2.22.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
